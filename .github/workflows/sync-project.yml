name: Sync Project Issues

on:
  workflow_dispatch:
    inputs:
      project_file:
        description: Arquivo especifico em .github/projects (ex. epic-03.yml). Vazio = todos
        required: false
        type: string
      dry_run:
        description: Apenas simular, sem criar issues
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/projects/**

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
      PROJECT_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.project_file || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuracao do projeto
        run: |
          if [ -z "$PROJECT_NUMBER" ]; then
            echo "PROJECT_NUMBER nao definido."
            echo "Configure a repository variable PROJECT_NUMBER (ex.: 2)."
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "PROJECT_SYNC_TOKEN nao definido."
            echo "O GITHUB_TOKEN da action NAO acessa Projects v2 de usuario."
            echo "Crie um PAT classic da conta diogorochaa com scopes repo + project"
            echo "e salve como repository secret PROJECT_SYNC_TOKEN."
            exit 1
          fi

          echo "Validando acesso ao project ${PROJECT_OWNER}/projects/${PROJECT_NUMBER}..."
          if ! gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json >/dev/null 2>&1; then
            echo "Nao foi possivel acessar o project ${PROJECT_OWNER}/projects/${PROJECT_NUMBER}."
            echo "Confira PROJECT_NUMBER e PROJECT_OWNER."
            echo "Se estiverem corretos, o PAT precisa do scope project da conta ${PROJECT_OWNER}."
            gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" || true
            exit 1
          fi

          echo "Project encontrado."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias do script
        working-directory: .github/scripts
        run: npm install

      - name: Sincronizar epico e tasks no GitHub Project
        run: node .github/scripts/sync-project-issues.mjs
