name: Sync Project Issues

on:
  workflow_dispatch:
    inputs:
      project_file:
        description: Arquivo especifico em .github/projects (ex. epic-03.yml). Vazio = todos
        required: false
        type: string
      dry_run:
        description: Apenas simular, sem criar issues
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/projects/**

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
      PROJECT_URL: ${{ vars.PROJECT_URL }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
      PROJECT_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.project_file || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuracao
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PROJECT_SYNC_TOKEN nao configurado."
            echo "GITHUB_TOKEN nao acessa GitHub Projects v2 de usuario."
            echo "Crie um PAT (classic) com scopes repo + project e salve como secret PROJECT_SYNC_TOKEN."
            exit 1
          fi

          if [ -z "$PROJECT_URL" ] && [ -z "$PROJECT_NUMBER" ]; then
            echo "PROJECT_URL nao definido."
            echo "Configure a repository variable PROJECT_URL, por exemplo:"
            echo "https://github.com/users/diogorochaa/projects/2"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias do script
        working-directory: .github/scripts
        run: npm install

      - name: Sincronizar epico e tasks no GitHub Project
        run: node .github/scripts/sync-project-issues.mjs
